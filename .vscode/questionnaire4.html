<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire 4</title>

    <link rel="stylesheet" href="css/questionnaire4.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="questionnaire-wrapper">

        <div class="questionnaire-card">

            <!-- Top Bar -->
            <div class="top-bar">

                <a href="questionnaire3.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>

                <span class="step-count">4 to 10</span>

            </div>

            <!-- Title -->

            <h1>
                How many hours do you sit everyday?
            </h1>

            <!-- Options -->

            <div class="options">

                <label class="option-card">
                    <span>Less than 2</span>
                    <input type="radio" name="hours">
                    <span class="radio"></span>
                </label>

                <label class="option-card">
                    <span>2-4</span>
                    <input type="radio" name="hours">
                    <span class="radio"></span>
                </label>

                <label class="option-card">
                    <span>4-6</span>
                    <input type="radio" name="hours">
                    <span class="radio"></span>
                </label>

                <label class="option-card">
                    <span>6-8</span>
                    <input type="radio" name="hours">
                    <span class="radio"></span>
                </label>

                <label class="option-card">
                    <span>More than 8</span>
                    <input type="radio" name="hours">
                    <span class="radio"></span>
                </label>

            </div>

            <a href="questionnaire5.html" class="next-btn">
                Next
            </a>

        </div>

    </div>

</body>

</html>
