<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire 7</title>

    <link rel="stylesheet" href="css/questionnaire7.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="questionnaire-wrapper">

        <div class="questionnaire-card">

            <!-- Top Bar -->

            <div class="top-bar">

                <a href="questionnaire6.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>

                <span class="step-count">7 to 10</span>

            </div>

            <!-- Title -->

            <h1>How often do you exercise?</h1>

            <!-- Options -->

            <div class="options">

                <label class="option-card">
                    <span>Never</span>
                    <input type="radio" name="exercise">
                    <span class="radio"></span>
                </label>

                <label class="option-card">
                    <span>1-2 days per week</span>
                    <input type="radio" name="exercise">
                    <span class="radio"></span>
                </label>

                <label class="option-card">
                    <span>3-5 days per week</span>
                    <input type="radio" name="exercise">
                    <span class="radio"></span>
                </label>

                <label class="option-card">
                    <span>Daily</span>
                    <input type="radio" name="exercise">
                    <span class="radio"></span>
                </label>

            </div>

            <a href="questionnaire8.html" class="next-btn">
                Next
            </a>

        </div>

    </div>

</body>

</html>
