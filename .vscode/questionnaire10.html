<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire 10</title>

    <link rel="stylesheet" href="css/questionnaire10.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="questionnaire-wrapper">

        <div class="questionnaire-card">

            <!-- Top Bar -->
            <div class="top-bar">

                <a href="questionnaire9.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <div class="progress-wrapper">
                    <div class="progress-fill"></div>
                </div>

                <span class="step-count">10 to 10</span>

            </div>

            <!-- Heading -->

            <h1>Here's your baseline</h1>

            <p class="subtitle">
                You can later adjust any of this later in Profile.
            </p>

            <!-- Summary Card -->

            <div class="summary-card">

                <div class="summary-row">
                    <div class="left">
                        <i class="fa-regular fa-user"></i>
                        <span>Experience level</span>
                    </div>
                    <strong>Beginner</strong>
                </div>

                <div class="summary-row">
                    <div class="left">
                        <i class="fa-solid fa-bullseye"></i>
                        <span>Goal</span>
                    </div>
                    <strong>2 goals selected</strong>
                </div>

                <div class="summary-row">
                    <div class="left">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span>Pain</span>
                    </div>
                    <strong>Shoulder, neck</strong>
                </div>

                <div class="summary-row">
                    <div class="left">
                        <i class="fa-solid fa-person-running"></i>
                        <span>Exercise frequency</span>
                    </div>
                    <strong>Never</strong>
                </div>

                <div class="summary-row">
                    <div class="left">
                        <i class="fa-regular fa-clock"></i>
                        <span>Available time</span>
                    </div>
                    <strong>15 minutes/day</strong>
                </div>

                <div class="summary-row">
                    <div class="left">
                        <i class="fa-regular fa-bell"></i>
                        <span>Daily reminders</span>
                    </div>

                    <span class="badge">Enabled</span>
                </div>

            </div>

            <!-- Button -->

            <a href="dashboard.html" class="journey-btn">
                Journey
            </a>

        </div>

    </div>

</body>

</html>
