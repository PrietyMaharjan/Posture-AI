<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostureAI Questionnaire</title>

    <link rel="stylesheet" href="css/questionnaire2.css" />

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" />
</head>

<body>
    <div class="questionnaire-wrapper">

        <div class="questionnaire-card">

            <!-- Top Bar -->
            <div class="top-bar">

                <a href="questionnaire1.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <div class="progress-wrapper">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>

                <span class="step-count">2 to 10</span>

            </div>

            <!-- Title -->
            <h1 class="question-title">
                Have you done posture correction exercises before?
            </h1>

            <!-- Options -->

            <label class="option-card">
                <div class="option-left">
                    <div class="icon-box">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <span>I am completely new</span>
                </div>

                <input type="radio" name="experience">
                <span class="radio"></span>
            </label>

            <label class="option-card">
                <div class="option-left">
                    <div class="icon-box">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <span>I have done a few exercises</span>
                </div>

                <input type="radio" name="experience">
                <span class="radio"></span>
            </label>

            <label class="option-card">
                <div class="option-left">
                    <div class="icon-box">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <span>I exercise regularly</span>
                </div>

                <input type="radio" name="experience">
                <span class="radio"></span>
            </label>

            <label class="option-card">
                <div class="option-left">
                    <div class="icon-box">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <span>I am a fitness professional</span>
                </div>

                <input type="radio" name="experience">
                <span class="radio"></span>
            </label>
            <!-- Button -->

            <a href="questionnaire3.html" class="continue-btn">
                Continue
            </a>

        </div>

    </div>
</body>

</html>
