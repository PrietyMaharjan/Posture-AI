<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire 5</title>

    <link rel="stylesheet" href="css/questionnaire5.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="questionnaire-wrapper">

        <div class="questionnaire-card">

            <!-- Top Bar -->
            <div class="top-bar">

                <a href="questionnaire4.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>

                <span class="step-count">5 to 10</span>

            </div>

            <!-- Title -->

            <h1>Do you currently experience pain?</h1>

            <!-- Options -->

            <div class="options">

                <label class="option-card">
                    <span>None</span>
                    <input type="radio" name="answer" value="option1">
                    <span class="checkbox"></span>
                </label>

                <label class="option-card">
                    <span>Neck</span>
                    <input type="radio" name="answer" value="option2">
                    <span class="checkbox"></span>
                </label>

                <label class="option-card">
                    <span>Shoulder</span>
                    <input type="radio" name="answer" value="option3">
                    <span class="checkbox"></span>
                </label>

                <label class="option-card">
                    <span>Upper back</span>
                    <input type="radio" name="answer" value="option4">
                    <span class="checkbox"></span>
                </label>

                <label class="option-card">
                    <span>Lower back</span>
                    <input type="radio" name="answer" value="option4">
                    <span class="checkbox"></span>
                </label>


                <label class="option-card">
                    <span>Multiple Areas</span>
                    <input type="radio" name="answer" value="option4">
                    <span class="checkbox"></span>
                </label>
            </div>

            <a href="questionnaire6.html" class="next-btn">
                Next
            </a>

        </div>

    </div>

</body>

</html>
