<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire 3</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <link rel="stylesheet" href="css/questionnaire3.css">
</head>

<body>

    <div class="questionnaire-wrapper">

        <div class="questionnaire-card">

            <!-- Top Bar -->
            <div class="top-bar">

                <a href="questionnaire2.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <div class="progress-wrapper">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>

                <span class="step-count">3 to 10</span>

            </div>

            <!-- Heading -->
            <h1 class="question-title">
                What would you like to improve?
            </h1>

            <p class="question-subtitle">
                Select all that apply.
            </p>

            <!-- Options -->

            <label class="option-card">
                <span>Better Posture</span>
                <input type="checkbox" name="goal" value="better-posture">
            </label>

            <label class="option-card">
                <span>Reduce neck pain</span>
                <input type="checkbox" name="goal" value="reduce-neck-pain">
            </label>

            <label class="option-card">
                <span>Reduce shoulder pain</span>
                <input type="checkbox" name="goal" value="reduce-shoulder-pain">
            </label>

            <label class="option-card">
                <span>Improve back posture</span>
                <input type="checkbox" name="goal" value="improve-back-posture">
            </label>

            <label class="option-card">
                <span>Improve sitting posture</span>
                <input type="checkbox" name="goal" value="improve-sitting-posture">
            </label>

            <label class="option-card">
                <span>Improve flexibility</span>
                <input type="checkbox" name="goal" value="improve-flexibility">
            </label>

            <label class="option-card">
                <span>Build healthy habits</span>
                <input type="checkbox" name="goal" value="build-healthy-habits">
            </label>

            <!-- Continue -->
            <a href="questionnaire4.html" class="continue-btn">
                Continue
            </a>

        </div>

    </div>

</body>

</html>
