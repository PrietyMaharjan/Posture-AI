<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostureAI Sign In</title>

    <link rel="stylesheet" href="css/signin.css">
</head>

<body>

    <div class="signin-container">

        <div class="left-panel">

            <h2 class="logo">PostureAI</h2>

            <div class="left-content">

                <h1>
                    Move better.<br>
                    Live better.
                </h1>

                <p>
                    Real-time posture feedback, right from your browser,
                    no wearable, no app download.
                </p>

                <div class="joined">

                    <div class="avatars">
                        <span class="blue"></span>
                        <span class="green"></span>
                        <span class="orange"></span>
                    </div>

                    <span>Joined by 40,000+ desks this year</span>

                </div>

            </div>

        </div>

        <div class="right-panel">

            <div class="form-box">

                <div class="tabs">

                    <a href="signin.html" class="active">Sign in</a>
                    <a href="signupfree.html">Sign up Free</a>

                </div>

                <form>

                    <label>Email or Phone</label>

                    <input type="text" placeholder="Enter your email/phone">

                    <label>Password</label>

                    <input type="password" placeholder="********">

                    <div class="forgot">

                        <a href="#">Forgot password?</a>

                    </div>

                    <a href="questionnaire1.html" class="signin-btn">
                        Sign In
                    </a>

                </form>

                <div class="divider">

                    <span>or</span>

                </div>

                <p class="signup-free-text">

                    New here?

                    <a href="signupfree.html">
                        Create an account
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
