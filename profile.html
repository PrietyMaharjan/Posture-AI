<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PostureAI - Profile & Settings</title>

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/font.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/profile.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="profile-page">
        <aside class="sidebar">

            <div class="logo">

                <img src="images/logo.jpg" alt="PostureAI Logo">

                <h2>PostureAI</h2>

            </div>


            <nav class="sidebar-nav">

                <!-- Home -->
                <a href="dashboard.html" class="nav-item">

                    <svg class="nav-icon" viewBox="0 0 24 24">

                        <path d="M3 10.5L12 3L21 10.5V21H15V15H9V21H3V10.5Z" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linejoin="round">
                        </path>

                    </svg>

                    <span>Home</span>

                </a>


                <!-- Scan -->
                <a href="scan.html" class="nav-item">

                    <svg class="nav-icon" viewBox="0 0 24 24">

                        <rect x="4" y="6" width="16" height="13" rx="2" fill="none" stroke="currentColor"
                            stroke-width="1.8">
                        </rect>

                        <circle cx="12" cy="12.5" r="3" fill="none" stroke="currentColor" stroke-width="1.8">
                        </circle>

                        <path d="M8 6L9 4H15L16 6" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round">
                        </path>

                    </svg>

                    <span>Scan</span>

                </a>


                <!-- Exercises -->
                <a href="all.html" class="nav-item">

                    <svg class="nav-icon" viewBox="0 0 24 24">

                        <circle cx="12" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="1.7">
                        </circle>

                        <path d="M12 7V19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                        </path>

                        <path d="M7 10L12 9L17 10" fill="none" stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round">
                        </path>

                        <path d="M9 19L12 13L15 19" fill="none" stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round">
                        </path>

                    </svg>

                    <span>Exercises</span>

                </a>


                <!-- Progress -->
                <a href="progressdaily.html" class="nav-item">

                    <svg class="nav-icon" viewBox="0 0 24 24">

                        <path d="M4 19V14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        </path>

                        <path d="M10 19V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        </path>

                        <path d="M16 19V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        </path>

                        <path d="M3 19H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        </path>

                        <path d="M4 11L9 8L14 10L20 4" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                        </path>

                    </svg>

                    <span>Progress</span>

                </a>


                <!-- Profile -->
                <a href="profile.html" class="nav-item active">

                    <svg class="nav-icon" viewBox="0 0 24 24">

                        <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7">
                        </circle>

                        <path d="M5 20C5.7 16.5 8.2 14.5 12 14.5C15.8 14.5 18.3 16.5 19 20" fill="none"
                            stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                        </path>

                    </svg>

                    <span>Profile</span>

                </a>

            </nav>


            <div class="sidebar-user">

                <div class="user-avatar"></div>

                <div class="user-info">

                    <strong>Priety Maharjan</strong>

                    <small>Free Plan</small>

                </div>

            </div>

        </aside>

        <main class="main-content">

            <header class="top-header">

                <h1>Profile &amp; Settings</h1>

                <div class="header-right">


                    <!-- Search -->
                    <div class="search">

                        <svg viewBox="0 0 24 24">

                            <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.7">
                            </circle>

                            <path d="M16 16L20 20" fill="none" stroke="currentColor" stroke-width="1.7"
                                stroke-linecap="round">
                            </path>

                        </svg>

                        <input type="text" placeholder="Search" aria-label="Search">

                    </div>


                    <!-- Notification -->
                    <a href="notification.html" class="notification">

                        <svg viewBox="0 0 24 24">

                            <path d="M18 9C18 5.7 15.8 3.5 12 3.5C8.2 3.5 6 5.7 6 9V13L4.5 16H19.5L18 13V9Z" fill="none"
                                stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                            </path>

                            <path d="M10 19C10.5 20 11.2 20.5 12 20.5C12.8 20.5 13.5 20 14 19" fill="none"
                                stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                            </path>

                        </svg>

                        <span class="notification-dot"></span>

                    </a>

                </div>

            </header>

            <div class="profile-content">

                <aside class="profile-menu">

                    <button type="button" class="profile-menu-item active">

                        Personal information

                    </button>


                    <button type="button" class="profile-menu-item">

                        Height &amp; Weight

                    </button>


                    <button type="button" class="profile-menu-item">

                        Notification preferences

                    </button>


                    <button type="button" class="profile-menu-item">

                        Privacy policy

                    </button>


                    <button type="button" class="profile-menu-item">

                        Billing

                    </button>


                    <button type="button" class="profile-menu-item logout">

                        Log out

                    </button>

                </aside>


                <section class="profile-card">


                    <div class="profile-photo-section">


                        <!-- Photo and name -->
                        <div class="profile-photo">

                            <div class="profile-avatar">

                                <img src="images/profilefoto.jpg" alt="Priety Maharjan">

                            </div>

                            <span class="profile-name">
                                Priety Maharjan
                            </span>

                            <button type="button" class="camera-btn" aria-label="Change profile photo">

                                <i class="fa-solid fa-camera"></i>

                                <span>+</span>

                            </button>

                        </div>

                        <button type="button" class="change-photo">

                            Change photo

                        </button>

                    </div>

                    <form class="profile-form">


                        <!-- Full Name -->
                        <div class="form-group">

                            <label for="full-name">
                                FULL NAME
                            </label>

                            <input type="text" id="full-name" value="Priety Maharjan">

                        </div>


                        <!-- Email -->
                        <div class="form-group">

                            <label for="email">
                                EMAIL
                            </label>

                            <input type="email" id="email" value="prietymaharjan13@gmail.com">

                        </div>


                        <!-- Height -->
                        <div class="form-group">

                            <label for="height">
                                HEIGHT
                            </label>

                            <input type="text" id="height" value="5'1&quot;">

                        </div>


                        <!-- Weight -->
                        <div class="form-group">

                            <label for="weight">
                                WEIGHT
                            </label>

                            <input type="text" id="weight" value="130 lbs">

                        </div>


                        <!-- Save Changes -->
                        <button type="submit" class="save-btn">

                            Save Changes

                        </button>

                    </form>

                </section>

            </div>

        </main>

    </div>

</body>

</html>
