<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostureAI SignupFree</title>
    <link rel="stylesheet" href="css/signupfree.css">
</head>

<body>

    <div class="signupfree-container">

        <div class="left-panel">

            <h2 class="logo">PostureAI</h2>

            <div class="left-content">

                <h1>
                    Move better.<br>
                    Live better.
                </h1>

                <p>
                    Real-time posture feedback, right from your browser,
                    no wearable, no app download.
                </p>

                <div class="joined">

                    <div class="avatars">
                        <span class="blue"></span>
                        <span class="green"></span>
                        <span class="orange"></span>
                    </div>

                    <span>Joined by 40,000+ desks this year</span>

                </div>

            </div>

        </div>

        <div class="right-panel">

            <div class="form-box">

                <div class="tabs">
                    <a href="signupfree.html" class="active">Sign up Free</a>
                    <a href="signin.html">Sign in</a>
                </div>

                <form>

                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name">

                    <label>Email or Phone</label>
                    <input type="text" placeholder="Enter your email or phone">

                    <label>Password</label>
                    <input type="password" placeholder="********">

                    <label>Confirm Password</label>
                    <input type="password" placeholder="********">

                    <button type="submit" class="signupfree-btn">Sign Up Free</button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
